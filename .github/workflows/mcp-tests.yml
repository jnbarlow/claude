name: LTM MCP Tests

on:
  push:
    branches: [main]
    paths:
      - "long-term-memory/mcp-server/**"
  pull_request:
    paths:
      - "long-term-memory/mcp-server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: long-term-memory/mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: long-term-memory/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
